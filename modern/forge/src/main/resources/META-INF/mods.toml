modLoader = "javafml"
loaderVersion = "${forge_range}"
license = "Apache-2.0"

[[mods]]
modId = "${mod_id}"
version = "${version}"
displayName = "${mod_name}"
# Forge 1.19 and later read this key, so that a server without the mod stays compatible in the server list.
displayTest = "IGNORE_ALL_VERSION"
description = '''
${mod_description}
'''

[[dependencies.${mod_id}]]
modId = "forge"
mandatory = true
versionRange = "${forge_range}"
ordering = "NONE"
side = "CLIENT"

[[dependencies.${mod_id}]]
modId = "minecraft"
mandatory = true
versionRange = "${minecraft_range}"
ordering = "NONE"
side = "CLIENT"
