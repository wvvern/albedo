pluginManagement {
    repositories {
        maven { url "https://maven.fabricmc.net/" }
        maven { url "https://maven.architectury.dev/" }
        maven { url "https://maven.neoforged.net/releases" }
        maven { url "https://maven.kikugie.dev/releases" }
        gradlePluginPortal()
    }
    // Obfuscated versions (<= 1.21.11) use the remapping Loom; unobfuscated ones (26.1+) the no-remap variant.
    plugins {
        id 'dev.architectury.loom' version '1.17-SNAPSHOT'
        id 'dev.architectury.loom-no-remap' version '1.17-SNAPSHOT'
        id 'architectury-plugin' version '3.5-SNAPSHOT'
        id 'com.gradleup.shadow' version '9.6.1'
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
    id 'dev.kikugie.stonecutter' version '0.9.8'
}

rootProject.name = 'block-painter-modern'

// The Minecraft-free core lives outside this build so the legacy build can share it.
// It is a project here only so its unit tests run; platform jars compile its sources directly.
include 'core'
project(':core').projectDir = file('../core')

stonecutter {
    kotlinController = false
    centralScript = 'build.gradle'

    create(getRootProject()) {
        // Each node needs versions/<version>/gradle.properties. Add a node by adding a folder + entry here.
        versions '1.21.1', '1.21.11', '26.3'
        vcsVersion = '26.3'

        branch 'common'
        branch 'fabric'
        branch 'neoforge'
    }
}
