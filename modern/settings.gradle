pluginManagement {
    repositories {
        maven { url "https://maven.fabricmc.net/" }
        maven { url "https://maven.architectury.dev/" }
        maven { url "https://maven.minecraftforge.net/" }
        maven { url "https://maven.neoforged.net/releases" }
        maven { url "https://maven.kikugie.dev/releases" }
        gradlePluginPortal()
    }
    // Obfuscated versions (<= 1.21.11) use the remapping Loom; unobfuscated ones (26.1+) the no-remap variant.
    plugins {
        id 'dev.architectury.loom' version '1.17-SNAPSHOT'
        id 'dev.architectury.loom-no-remap' version '1.17-SNAPSHOT'
        id 'architectury-plugin' version '3.5-SNAPSHOT'
        id 'com.gradleup.shadow' version '9.6.1'
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
    id 'dev.kikugie.stonecutter' version '0.9.8'
}

rootProject.name = 'albedo-modern'

// The core is outside this build so that the legacy build can share it; this project runs its checks and tests.
include 'core'
project(':core').projectDir = file('../core')

// Each node needs versions/<node>/gradle.properties, and a Forge or NeoForge node also <loader>/versions/<node>/gradle.properties with loom.platform.
// tools/build-all.ps1 reads these three lists, so keep each list on one line; common and fabric build all nodes.
def nodes = ['1.21.1', '1.21.3', '1.21.4', '1.21.11', '26.3']
def forgeNodes = []
def neoforgeNodes = ['1.21.1', '1.21.3', '1.21.4', '1.21.11', '26.3']

stonecutter {
    kotlinController = false
    centralScript = 'build.gradle'

    create(getRootProject()) {
        versions(nodes as String[])
        vcsVersion = '26.3'

        branch 'common'
        branch 'fabric'
        // Stonecutter does not accept a branch with no versions.
        if (forgeNodes) branch('forge') { versions(forgeNodes as String[]) }
        branch('neoforge') { versions(neoforgeNodes as String[]) }
    }
}
