// The dev run of a Fabric node on Quilt Loader (-Pquilt), applied by fabric/build.gradle.
repositories { maven { name = 'Quilt'; url = 'https://maven.quiltmc.org/repository/release/' } }

dependencies {
    runtimeOnly "org.quiltmc:quilt-loader:$rootProject.quilt_loader_version"
    // The pom of Quilt Loader lists no libraries; these two are the ones of quilt_installer.json that Fabric Loader does not have (Loom adds the rest).
    runtimeOnly 'org.quiltmc:quilt-json5:1.0.4+final'
    runtimeOnly 'org.quiltmc:quilt-config:1.3.3'
    runtimeOnly 'io.github.llamalad7:mixinextras-fabric:0.5.5'
}

loom.runs.named('client') { property 'fabric.dli.main', 'org.quiltmc.loader.impl.launch.knot.KnotClient' }
// The mod is the classes and resources of this node and of the common node, which Quilt Loader reads as one mod through the group of these paths.
def ownBuild = project.layout.buildDirectory.get().asFile.toPath()
def commonBuild = rootProject.file("common/versions/${project.node}/build").toPath()
if (project.hasProperty('quiltJar')) {
    // -PquiltJar runs the release jar of this node as a mod, with none of the classes of the node on the class path.
    def modsDir = file("${project.findProperty('runDir') ?: 'run'}/mods")
    def installJar = tasks.register('installQuiltJar', Copy) {
        from project.releaseJarTask
        into modsDir
        doFirst { delete fileTree(modsDir) { include 'albedo-*.jar' } }
    }
    def jarRun = sourceSets.create('quiltJar')
    jarRun.runtimeClasspath = sourceSets.main.runtimeClasspath.filter { !it.toPath().startsWith(ownBuild) && !it.toPath().startsWith(commonBuild) }
    loom.runs.named('client') { source(jarRun) }
    tasks.matching { it.name == 'runClient' }.configureEach { dependsOn installJar }
} else {
    // Quilt Loader needs folders here, so the class and resource folders of both nodes join the class path next to the dev jar of the common node.
    def own = [ownBuild, commonBuild].collectMany { [it.resolve('classes/java/main'), it.resolve('resources/main')] }.collect { it.toFile() }
    dependencies { runtimeOnly files(own) }
    loom.runs.named('client') { property 'loader.classPathGroups', own.collect { it.absolutePath }.join(File.pathSeparator) }
}
// Quilt Loader reads the loader.* names of the properties that Fabric Loader reads as fabric.*.
tasks.matching { it.name == 'generateDLIConfig' }.configureEach {
    doLast {
        def file = outputs.files.singleFile
        def renamed = ~/^(\s*)fabric\.(development|defaultMixinRemapType|remapClasspathFile|classPathGroups)=/
        file.text = file.readLines().collectMany { line -> line =~ renamed ? [line, line.replaceFirst(renamed, '$1loader.$2=')] : [line] }.join('\n') + '\n'
    }
}
