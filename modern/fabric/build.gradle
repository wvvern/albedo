apply from: rootProject.file('gradle/node.gradle')
apply from: rootProject.file('gradle/platform.gradle')

architectury {
    platformSetupLoomIde()
    fabric()
}

repositories {
    maven { name = 'TerraformersMC'; url = 'https://maven.terraformersmc.com/releases' }
}

// -Pquilt runs the dev game on Quilt Loader in place of Fabric Loader, which is the way to test a jar on Quilt (python -m tools harness --loader quilt).
def quilt = project.hasProperty('quilt')

dependencies {
    // Loom reads the main class and the libraries of the loader from the Fabric Loader jar, so Quilt Loader runs next to it as the launcher.
    add(quilt ? project.modCompileOnly : project.modImplementation, "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version")
    // Optional: only the "Configure" button in Mod Menu uses it; the mod runs without Mod Menu.
    add(project.modCompileOnly, "com.terraformersmc:modmenu:$project.modmenu_version") { transitive = false }
}

if (quilt) apply from: rootProject.file('fabric/quilt.gradle')

processResources {
    def props = [
            mod_id           : rootProject.mod_id,
            mod_name         : rootProject.mod_name,
            version          : project.version,
            minecraft_range  : project.minecraft_range_fabric,
            java_version     : project.java_version,
            fabric_loader_min: rootProject.fabric_loader_min,
    ]
    inputs.properties props
    filesMatching('fabric.mod.json') { expand props }
}
