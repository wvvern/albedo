org.gradle.jvmargs=-Xmx6G
org.gradle.parallel=true
# Gradle configures only the projects of the requested tasks, because Loom mixes the mappings of the nodes when it configures all of them.
org.gradle.configureondemand=true

mod_id=albedo
mod_name=Albedo
mod_version=0.6.1
maven_group=dev.albedo
archives_name=albedo

# The build uses fabric_loader_version, and the Fabric jar asks for fabric_loader_min, the first version with MixinExtras.
fabric_loader_version=0.19.5
fabric_loader_min=0.15.0

dev.kikugie.stonecutter.hard_mode=true
