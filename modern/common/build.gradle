apply from: rootProject.file('gradle/shared.gradle')

architectury {
    // The loaders that have a jar for this Minecraft version.
    common(['fabric', 'forge', 'neoforge'].findAll { rootProject.findProject(":${it}:${stonecutter.current.project}") != null })
}

dependencies {
    // Gives the common code the Mixin classes; it uses no Fabric Loader classes.
    add(project.modImplementation, "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version")
    // MixinExtras ships inside both Fabric Loader and NeoForge; compile against it only.
    compileOnly 'io.github.llamalad7:mixinextras-common:0.4.1'
    annotationProcessor 'io.github.llamalad7:mixinextras-common:0.4.1'
}
