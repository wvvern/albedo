plugins {
    id 'dev.kikugie.stonecutter'
    id 'dev.architectury.loom' apply false
    id 'dev.architectury.loom-no-remap' apply false
    id 'architectury-plugin' apply false
    id 'com.gradleup.shadow' apply false
}

// The version whose code is active (uncommented) in src/, which the "Set active project to X" tasks rewrite.
stonecutter.active '26.3'

stonecutter.parameters {
    // In code, `/*$ minecraft*/ "26.3";` becomes the Minecraft version of the node, which is not always the node name.
    def node = new Properties()
    file("versions/${current.project}/gradle.properties").withInputStream { node.load(it) }
    swaps.put('minecraft', "\"${node.minecraft_version}\";")

    // The rendering families, for `//? if gl_core {`; use a version predicate only for one API rename.
    def family = { String range -> eval(current.version, range) }
    constants.put('gl_fixed', family('<1.17'))
    constants.put('gl_core', family('>=1.17 <1.21.2'))
    constants.put('frame_graph', family('>=1.21.2 <1.21.5'))
    constants.put('gpu_device', family('>=1.21.5 <26.3'))
    constants.put('renderpearl', family('>=26.3'))
    // The raw GL classes go past their families: the sky classes to 1.21.5, and the Chroma and atlas classes to 1.21.10.
    constants.put('gl_sky', family('>=1.17 <1.21.6'))
    constants.put('gl_chroma', family('>=1.17 <1.21.11'))
    // The GL program and state helpers of the raw GL and the fixed function classes.
    constants.put('gl_program', family('<1.21.11'))
}
