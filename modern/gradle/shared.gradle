// Shared setup for each Minecraft version node of common, fabric, forge and neoforge.
def loader = project.parent.name
def node = stonecutter.current.project

def versionProperties = new Properties()
rootProject.file("versions/${node}/gradle.properties").withInputStream { versionProperties.load(it) }
versionProperties.each { key, value -> project.ext.set(key, value) }
// -Pmc_override=<version> builds the node against a different Minecraft version, to examine a minor version of its range.
if (project.hasProperty('mc_override')) project.ext.set('minecraft_version', project.property('mc_override'))

// Minecraft is obfuscated up to 1.21.11 and unobfuscated from 26.1 on.
def unobfuscated = stonecutter.eval(stonecutter.current.version, '>=26.1')
def javaVersion = (project.java_version as String).toInteger()
ext.unobfuscated = unobfuscated
ext.modImplementation = unobfuscated ? 'implementation' : 'modImplementation'

group = "${rootProject.maven_group}.${loader}"
version = "${rootProject.mod_version}+${project.minecraft_version}"

apply plugin: unobfuscated ? 'dev.architectury.loom-no-remap' : 'dev.architectury.loom'
apply plugin: 'architectury-plugin'
if (loader != 'common') {
    apply plugin: 'com.gradleup.shadow'
}

architectury {
    minecraft = project.minecraft_version
}

base {
    archivesName = "$rootProject.archives_name-$loader"
}

dependencies {
    minecraft "com.mojang:minecraft:$project.minecraft_version"
    if (!unobfuscated) {
        mappings loom.officialMojangMappings()
    }
}

if (loader == 'common') {
    sourceSets.main.java.srcDir rootProject.file('../core/src/main/java')
    // The core resources (the sky shaders) go into the jar next to the core classes.
    sourceSets.main.resources.srcDir rootProject.file('../core/src/main/resources')

    // A mixin file with a whole-file version condition gives no class on some nodes, so the list of the node comes from its compiled classes.
    // Only these three name endings are mixins, because the game stops at start for a different class in the list.
    def mixinClasses = fileTree(tasks.named('compileJava').flatMap { it.destinationDirectory.dir('dev/albedo/modern/mixin') }) {
        include '*Mixin.class', '*Accessor.class', '*Invoker.class'
        exclude '*$*'
    }
    // Mixin 0.8 has no level above JAVA_21 on all loaders, and a config can be at a lower level than its classes.
    def compatibilityLevel = "JAVA_${Math.min(javaVersion, 21)}"
    processResources {
        dependsOn 'compileJava'
        inputs.files(mixinClasses).withPropertyName('mixinClasses').withPathSensitivity(PathSensitivity.NAME_ONLY)
        inputs.property 'compatibilityLevel', compatibilityLevel
        filesMatching('albedo.mixins.json') {
            filter { String line ->
                def names = mixinClasses.files.collect { "\"${it.name - '.class'}\"" }.sort()
                line.replace('@compatibility_level@', compatibilityLevel).replace('"@mixins@"', names.join(',\n    '))
            }
        }
    }
}

if (loader != 'common') {
    loom.runs {
        configureEach {
            generateRunConfig.set(true)
            appendProjectPathToDisplayName.set(false)
            ideConfigFolder.set([fabric: 'Fabric', forge: 'Forge', neoforge: 'NeoForge'][loader])
        }
        getByName('client') {
            displayName.set("Client:${loader}:${stonecutter.current.version}")
            // -Pharness=<dir> enables the file-driven test harness (see core Harness) at a fixed window size.
            if (project.hasProperty('harness')) {
                property('albedo.harness', new File(project.property('harness') as String).absolutePath)
                programArgs('--width', '1600', '--height', '900')
            }
            // -Pbackend=vulkan|opengl forces the graphics backend of 26.2 and later; -PvulkanValidation turns on the Vulkan validation layers.
            if (project.hasProperty('backend')) programArgs('--graphicsBackend', project.property('backend') as String)
            if (project.hasProperty('vulkanValidation')) programArgs('--vulkanValidation')
        }
        named('server') { displayName.set("Server:${loader}:${stonecutter.current.version}") }
    }
}

// -Pcompat=sodium (or embeddium, iris, or a comma list) adds that mod to the dev run only, from versions/<v>/gradle.properties.
if (loader != 'common' && project.hasProperty('compat')) {
    def mods = (project.property('compat') as String).toLowerCase().split(',')*.trim().findAll { it }
    if ('iris' in mods) {
        // Iris needs Sodium, which cannot run with Embeddium.
        if ('embeddium' in mods) logger.warn('-Pcompat: Iris needs Sodium, so Embeddium is not added')
        mods = ['sodium'] + (mods - ['sodium', 'embeddium'])
    }
    // NeoForge runs with Mojang names from 1.20.5, and a remap would drop the jar-in-jar list from which Sodium loads its mod.
    def mojangRuntime = unobfuscated || (loader == 'neoforge' && stonecutter.eval(stonecutter.current.version, '>=1.20.5'))
    def runtime = mojangRuntime ? 'runtimeOnly' : 'modLocalRuntime'
    // Sodium 0.5 starts only with the LWJGL version of the game, and the dev run can pick a newer one.
    if (project.hasProperty('lwjgl_version')) {
        configurations.configureEach {
            resolutionStrategy.eachDependency { if (it.requested.group == 'org.lwjgl') it.useVersion(project.lwjgl_version) }
        }
    }
    repositories {
        exclusiveContent {
            forRepository { maven { name = 'Modrinth'; url = 'https://api.modrinth.com/maven' } }
            filter { includeGroup 'maven.modrinth' }
        }
    }
    dependencies {
        mods.each { mod ->
            def modVersion = project.findProperty("${mod}_${loader}")
            // A node with no build of this mod for its loader only logs it.
            if (modVersion == null) logger.info("No ${mod} build for ${loader} ${project.minecraft_version}")
            else add(runtime, "maven.modrinth:${mod}:${modVersion}")
        }
        // Most players use Sodium with Fabric API, so the test does too (Sodium 0.2 on 1.16.5 needs none). Albedo itself does not need it.
        if (loader == 'fabric' && 'sodium' in mods && project.hasProperty('fabric_api_version')) add(runtime, "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}") {
            // The Fabric API of 1.17 asks for an older Fabric Loader, which the dev run then has twice.
            exclude group: 'net.fabricmc', module: 'fabric-loader'
        }
        // Sodium 0.3 and 0.4 nest JOML, which the game does not have before 1.19.3, and Loom's remap drops the nested jars.
        if (project.hasProperty('joml_version')) add('runtimeOnly', "org.joml:joml:${project.joml_version}")
        // Loom's remap of a mod dependency drops its nested jars, so the remapped versions add the Iris libraries here.
        def irisLibs = 'iris' in mods ? project.findProperty("iris_libs_${loader}") : null
        if (irisLibs) (irisLibs as String).split(',')*.trim().each { add('runtimeOnly', it) { transitive = false } }
    }
}

// The tool chain alone sets the Java level, because javac 8 has no --release option.
java { toolchain { languageVersion = JavaLanguageVersion.of(javaVersion) } }

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

tasks.withType(AbstractArchiveTask).configureEach {
    zip64 = true
}

if (loader != 'common') {
    configurations {
        common { canBeResolved = true; canBeConsumed = false }
        compileClasspath.extendsFrom common
        runtimeClasspath.extendsFrom common
        shadowBundle { canBeResolved = true; canBeConsumed = false }
    }
    def platformName = [fabric: 'Fabric', forge: 'Forge', neoforge: 'NeoForge'][loader]
    // The Architectury plugin makes this configuration later, when the loader script selects the platform.
    configurations.matching { it.name == "development${platformName}" }.configureEach { extendsFrom configurations.common }

    def commonNode = ":common:${node}"
    dependencies {
        common(unobfuscated ? project(commonNode) : project(path: commonNode, configuration: 'namedElements')) { transitive false }
        shadowBundle project(path: commonNode, configuration: "transformProduction${platformName}")
    }

    jar { archiveClassifier = 'raw' }

    tasks.named('shadowJar') {
        configurations = [project.configurations.shadowBundle]
        mergeServiceFiles()
        archiveClassifier = unobfuscated ? '' : 'dev-shadow'
    }
    if (!unobfuscated) {
        tasks.named('remapJar') {
            inputFile.set(tasks.named('shadowJar').flatMap { it.archiveFile })
            dependsOn 'shadowJar'
            archiveClassifier = ''
        }
    }
    tasks.register('releaseJar') {
        group = 'build'
        description = 'Builds the jar to install for this loader and Minecraft version.'
        dependsOn tasks.named(unobfuscated ? 'shadowJar' : 'remapJar')
    }
    tasks.named('assemble') { dependsOn 'releaseJar' }
}
