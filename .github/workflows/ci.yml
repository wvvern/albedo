name: CI

# Builds all jars and runs the checks on every push and pull request, and makes a release for a tag such as v1.2.0 (docs/RELEASING.md).
on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

permissions:
  contents: read

env:
  # The tag on release builds and empty otherwise, so that a release gets the tag version, not the one in gradle.properties.
  TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    outputs:
      notes: ${{ steps.notes.outputs.notes }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      - run: bash tools/lint.sh
      - run: ./gradlew --configure-on-demand :core:check
        working-directory: modern
      - name: Release notes
        # A tag without its CHANGELOG.md section fails here, so no release is made.
        if: env.TAG != ''
        id: notes
        run: |
          notes="$(bash tools/release-notes.sh "$TAG")"
          printf 'notes<<EOF\n%s\nEOF\n' "$notes" >> "$GITHUB_OUTPUT"

  modern:
    name: Build ${{ matrix.target.mc }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # To add a Minecraft version, see "Add a Minecraft version" in docs/ARCHITECTURE.md.
        target: &modern
          # mc-publish reads one game version per line.
          - { mc: '1.21.1', game_versions: "1.21\n1.21.1" }
          - { mc: '1.21.11', game_versions: '1.21.11' }
          - { mc: '26.3', game_versions: '26.3' }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            21
            25
      - uses: gradle/actions/setup-gradle@v5
      - name: Build
        working-directory: modern
        env:
          MC: ${{ matrix.target.mc }}
        # Configure on demand so that Gradle sets up only the projects of this version.
        run: |
          ./gradlew --configure-on-demand -Porg.gradle.java.installations.fromEnv=JAVA_HOME_21_X64,JAVA_HOME_25_X64 \
            ${TAG:+-Pmod_version=${TAG#v}} :fabric:$MC:releaseJar :neoforge:$MC:releaseJar
          mkdir -p ../dist
          cp {fabric,neoforge}/versions/$MC/build/libs/albedo-*+$MC.jar ../dist/
      - uses: actions/upload-artifact@v7
        with:
          name: jars-${{ matrix.target.mc }}
          path: dist/*.jar
          if-no-files-found: error

  legacy:
    name: Build 1.8.9
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            8
            21
      - uses: gradle/actions/setup-gradle@v5
      - name: Build
        working-directory: legacy
        run: ./gradlew -Porg.gradle.java.installations.fromEnv=JAVA_HOME_8_X64,JAVA_HOME_21_X64 ${TAG:+-Pversion=${TAG#v}+1.8.9} build
      - uses: actions/upload-artifact@v7
        with:
          name: jars-1.8.9
          path: legacy/build/libs/albedo-*.jar
          if-no-files-found: error

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check, modern, legacy]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - uses: actions/attest-build-provenance@v3
        with:
          subject-path: dist/*.jar
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ needs.check.outputs.notes }}
        run: |
          jar="$(cd dist && ls albedo-fabric-*.jar | tail -1)"
          cat > notes.md <<EOF
          $NOTES

          To make sure that a jar comes from this repository, run this command in its folder. Use the name of your jar.

          ~~~
          gh attestation verify $jar -R $GITHUB_REPOSITORY
          ~~~
          EOF
          gh release create "$TAG" dist/*.jar --repo "$GITHUB_REPOSITORY" --title "Albedo ${TAG#v}" --notes-file notes.md

  modrinth:
    name: Modrinth ${{ matrix.loader }} ${{ matrix.target.mc }}
    # Needs the repository variable MODRINTH_PROJECT_ID and the secret MODRINTH_TOKEN.
    if: vars.MODRINTH_PROJECT_ID != ''
    needs: [check, release]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: *modern
        loader: [fabric, neoforge]
        include:
          - { target: { mc: '1.8.9', game_versions: '1.8.9' }, loader: forge }
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: jars-${{ matrix.target.mc }}
          path: dist
      - uses: Kir-Antipov/mc-publish@v3
        with:
          modrinth-id: ${{ vars.MODRINTH_PROJECT_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          files: dist/albedo-${{ matrix.loader }}-*.jar
          name: Albedo ${{ env.TAG }} for ${{ matrix.loader }} ${{ matrix.target.mc }}
          version: ${{ env.TAG }}+${{ matrix.loader }}-${{ matrix.target.mc }}
          loaders: ${{ matrix.loader }}
          game-versions: ${{ matrix.target.game_versions }}
          changelog: ${{ needs.check.outputs.notes }}
