name: CI

# Builds all jars and runs the checks on every push and pull request, and makes a release for a tag such as v1.2.0 (docs/RELEASING.md).
on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

permissions:
  contents: read

env:
  # The tag on release builds and empty otherwise, so that a release gets the tag version, not the one in gradle.properties.
  TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    # The rows of the build and upload jobs, from the node lists and the node properties of modern/ and legacy/ (tools/ci_matrix.py).
    outputs:
      modern: ${{ steps.matrix.outputs.modern }}
      legacy: ${{ steps.matrix.outputs.legacy }}
      publish: ${{ steps.matrix.outputs.publish }}
      jars: ${{ steps.matrix.outputs.jars }}
    steps:
      - uses: actions/checkout@v7
      - id: matrix
        run: python3 -m tools ci-matrix >> "$GITHUB_OUTPUT"

  check:
    name: Check
    runs-on: ubuntu-latest
    outputs:
      notes: ${{ steps.notes.outputs.notes }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      - run: python3 -m tools lint
      - name: Check the tools
        run: |
          python3 -m unittest discover -s tools/tests -t .
          pipx run ruff==0.17.5 check tools
          pipx run ruff==0.17.5 format --check tools
      - run: ./gradlew --configure-on-demand :core:check
        working-directory: modern
      - name: Release notes
        # A tag without its CHANGELOG.md section fails here, so no release is made.
        if: env.TAG != ''
        id: notes
        run: |
          notes="$(python3 -m tools release-notes "$TAG")"
          printf 'notes<<EOF\n%s\nEOF\n' "$notes" >> "$GITHUB_OUTPUT"

  modern:
    name: Build ${{ matrix.target.mc }}
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.plan.outputs.modern) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          # The tool chain of the node, then 25, which runs Gradle.
          java-version: |
            ${{ matrix.target.java }}
            25
      - uses: gradle/actions/setup-gradle@v5
        with:
          # The entries of all node jobs together are larger than the cache limit of the repository, so only Check and the legacy jobs write.
          cache-read-only: true
      - name: Build
        working-directory: modern
        env:
          NODE: ${{ matrix.target.node }}
          MC: ${{ matrix.target.mc }}
          JAVA: ${{ matrix.target.java }}
          LOADERS: ${{ join(matrix.target.loaders, ' ') }}
        # Configure on demand so that Gradle sets up only the projects of this node.
        run: |
          tasks=""
          for loader in $LOADERS; do tasks="$tasks :$loader:$NODE:releaseJar"; done
          ./gradlew --configure-on-demand -Porg.gradle.java.installations.fromEnv=JAVA_HOME_${JAVA}_X64,JAVA_HOME_25_X64 \
            ${TAG:+-Pmod_version=${TAG#v}} $tasks
          mkdir -p ../dist
          for loader in $LOADERS; do
            cp "$loader/versions/$NODE/build/libs/albedo-$loader-"*"+$MC.jar" ../dist/
          done
      - name: Examine the jars
        run: python3 -m tools check-jar dist
      - uses: actions/upload-artifact@v7
        with:
          name: jars-${{ matrix.target.mc }}
          path: dist/*.jar
          if-no-files-found: error

  legacy:
    name: Build ${{ matrix.mc }}
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mc: ${{ fromJSON(needs.plan.outputs.legacy) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            8
            21
      - uses: gradle/actions/setup-gradle@v5
      - name: Build
        working-directory: legacy
        env:
          MC: ${{ matrix.mc }}
        run: |
          ./gradlew --configure-on-demand -Porg.gradle.java.installations.fromEnv=JAVA_HOME_8_X64,JAVA_HOME_21_X64 \
            ${TAG:+-PmodVersion=${TAG#v}} ":$MC:build"
          mkdir -p ../dist
          cp "versions/$MC/build/libs/albedo-forge-"*"+$MC.jar" ../dist/
      - name: Examine the jar
        run: python3 -m tools check-jar dist
      - uses: actions/upload-artifact@v7
        with:
          name: jars-${{ matrix.mc }}
          path: dist/*.jar
          if-no-files-found: error

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [plan, check, modern, legacy]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Count the jars
        env:
          JARS: ${{ needs.plan.outputs.jars }}
        run: test "$(ls dist/*.jar | wc -l)" = "$JARS"
      - uses: actions/attest-build-provenance@v3
        with:
          subject-path: dist/*.jar
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ needs.check.outputs.notes }}
        run: |
          jar="$(cd dist && ls albedo-fabric-*.jar | tail -1)"
          cat > notes.md <<EOF
          $NOTES

          To make sure that a jar comes from this repository, run this command in its folder. Use the name of your jar.

          ~~~
          gh attestation verify $jar -R $GITHUB_REPOSITORY
          ~~~
          EOF
          gh release create "$TAG" dist/*.jar --repo "$GITHUB_REPOSITORY" --title "Albedo ${TAG#v}" --notes-file notes.md

  modrinth:
    name: Modrinth ${{ matrix.target.mc }}
    # Needs the repository variable MODRINTH_PROJECT_ID and the secret MODRINTH_TOKEN.
    if: vars.MODRINTH_PROJECT_ID != ''
    needs: [plan, check, release]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.plan.outputs.publish) }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: jars-${{ matrix.target.mc }}
          path: dist
      # Each loader has its own step, which also runs when the step of a different loader failed.
      - name: Fabric
        if: ${{ !cancelled() && contains(matrix.target.loaders, 'fabric') }}
        uses: Kir-Antipov/mc-publish@v3
        with:
          modrinth-id: ${{ vars.MODRINTH_PROJECT_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          files: dist/albedo-fabric-*.jar
          name: Albedo ${{ env.TAG }} for fabric ${{ matrix.target.mc }}
          version: ${{ env.TAG }}+fabric-${{ matrix.target.mc }}
          loaders: ${{ matrix.target.fabric_loaders || 'fabric' }}
          game-versions: ${{ matrix.target.fabric_game_versions || matrix.target.game_versions }}
          changelog: ${{ needs.check.outputs.notes }}
      - name: Forge
        if: ${{ !cancelled() && contains(matrix.target.loaders, 'forge') }}
        uses: Kir-Antipov/mc-publish@v3
        with:
          modrinth-id: ${{ vars.MODRINTH_PROJECT_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          files: dist/albedo-forge-*.jar
          name: Albedo ${{ env.TAG }} for forge ${{ matrix.target.mc }}
          version: ${{ env.TAG }}+forge-${{ matrix.target.mc }}
          loaders: forge
          game-versions: ${{ matrix.target.game_versions }}
          changelog: ${{ needs.check.outputs.notes }}
      - name: NeoForge
        if: ${{ !cancelled() && contains(matrix.target.loaders, 'neoforge') }}
        uses: Kir-Antipov/mc-publish@v3
        with:
          modrinth-id: ${{ vars.MODRINTH_PROJECT_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          files: dist/albedo-neoforge-*.jar
          name: Albedo ${{ env.TAG }} for neoforge ${{ matrix.target.mc }}
          version: ${{ env.TAG }}+neoforge-${{ matrix.target.mc }}
          loaders: neoforge
          game-versions: ${{ matrix.target.game_versions }}
          changelog: ${{ needs.check.outputs.notes }}

  modrinth-page:
    name: Modrinth page
    needs: [release]
    uses: ./.github/workflows/modrinth-page.yml
    secrets: inherit
