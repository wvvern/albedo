name: CI

# Builds and tests all targets on each push and pull request.
# Push a tag such as v1.2.0 to make a GitHub release. Modrinth upload needs the setup below.
on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

env:
  # Set on tag builds only. The jars then use the tag version, not the version in gradle.properties.
  TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}

jobs:
  modern:
    name: ${{ matrix.mc }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mc: ['1.21.1', '1.21.11', '26.3']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            21
            25
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        working-directory: modern
        # Configure on demand: set up only the projects for this version.
        run: |
          ./gradlew --configure-on-demand -Porg.gradle.java.installations.fromEnv=JAVA_HOME_21_X64,JAVA_HOME_25_X64 \
            ${TAG:+-Pmod_version=${TAG#v}} \
            ${{ matrix.mc == '26.3' && ':core:check' || '' }} \
            :fabric:$MC:releaseJar :neoforge:$MC:releaseJar
          mkdir -p ../dist && cp {fabric,neoforge}/versions/$MC/build/libs/albedo-*+$MC.jar ../dist/
        env:
          MC: ${{ matrix.mc }}
      - uses: actions/upload-artifact@v4
        with:
          name: jars-${{ matrix.mc }}
          path: dist/*.jar
          if-no-files-found: error

  legacy:
    name: '1.8.9'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            8
            21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        working-directory: legacy
        run: ./gradlew -Porg.gradle.java.installations.fromEnv=JAVA_HOME_8_X64,JAVA_HOME_21_X64 ${TAG:+-Pversion=${TAG#v}+1.8.9} build
      - uses: actions/upload-artifact@v4
        with:
          name: jars-1.8.9
          path: legacy/build/libs/albedo-*.jar
          if-no-files-found: error

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash tools/lint.sh
      - name: Release notes
        # A tag needs its CHANGELOG.md section (docs/RELEASING.md). Without it, no release is made.
        if: env.TAG != ''
        run: bash tools/release-notes.sh "$TAG"

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [modern, legacy, lint]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash tools/release-notes.sh "$TAG" > notes.md
          gh release create "$TAG" dist/*.jar --repo "$GITHUB_REPOSITORY" --title "Albedo ${TAG#v}" --notes-file notes.md

  modrinth:
    # Runs only when the repository variable MODRINTH_PROJECT_ID and the secret MODRINTH_TOKEN exist.
    if: startsWith(github.ref, 'refs/tags/v') && vars.MODRINTH_PROJECT_ID != ''
    needs: release
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { target: '1.21.1', loader: fabric, mc: '1.21, 1.21.1' }
          - { target: '1.21.1', loader: neoforge, mc: '1.21, 1.21.1' }
          - { target: '1.21.11', loader: fabric, mc: '1.21.11' }
          - { target: '1.21.11', loader: neoforge, mc: '1.21.11' }
          - { target: '26.3', loader: fabric, mc: '26.3' }
          - { target: '26.3', loader: neoforge, mc: '26.3' }
          - { target: '1.8.9', loader: forge, mc: '1.8.9' }
    steps:
      - uses: actions/checkout@v4
      - run: bash tools/release-notes.sh "$TAG" > notes.md
      - uses: actions/download-artifact@v4
        with:
          name: jars-${{ matrix.target }}
          path: dist
      - uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ vars.MODRINTH_PROJECT_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          files: dist/albedo-${{ matrix.loader }}-*.jar
          name: Albedo ${{ env.TAG }} for ${{ matrix.loader }} ${{ matrix.target }}
          version: ${{ env.TAG }}+${{ matrix.loader }}-${{ matrix.target }}
          loaders: ${{ matrix.loader }}
          game-versions: ${{ matrix.mc }}
          changelog-file: notes.md
