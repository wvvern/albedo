name: Modrinth description

# Sets the description of the Modrinth project to docs/modrinth.md.
# CI runs it after a release. To run it by hand: gh workflow run modrinth-description.yml
# The token needs the Modrinth scope "Write projects".
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  description:
    if: vars.MODRINTH_PROJECT_ID != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Update
        env:
          PROJECT: ${{ vars.MODRINTH_PROJECT_ID }}
          TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: |
          jq -n --rawfile body docs/modrinth.md '{body: $body}' > body.json
          curl -fsS -X PATCH "https://api.modrinth.com/v2/project/$PROJECT" \
            -H "Authorization: $TOKEN" \
            -H "Content-Type: application/json" \
            -H "User-Agent: $GITHUB_REPOSITORY (GitHub Actions)" \
            --data @body.json
